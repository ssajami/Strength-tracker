<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root{
    --bg:#141310; --card:#1e1c16; --card2:#26231b; --line:#332f24;
    --ink:#f3efe4; --muted:#9c9584; --dim:#6f6a5c;
    --amber:#e8a33d; --amber-dim:#7a5a24; --good:#7fb069; --deload:#5a86a8;
    --peak:#d9764a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.4;padding:0 0 64px}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  .tabs{display:flex;gap:6px;margin:14px 0 4px}
  .tab{flex:1;text-align:center;padding:11px;border-radius:11px;background:var(--card);
    border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;transition:.12s}
  .tab.active{background:var(--amber);border-color:var(--amber);color:#1a1710}

  .cwk{width:100%;border-collapse:collapse;margin:14px 0 20px;font-family:var(--mono);font-size:14px}
  .cwk th,.cwk td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
  .cwk th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .cwk td{color:var(--ink);font-variant-numeric:tabular-nums}
  .cwk tr.dl td{color:var(--deload)} .cwk tr.pk td{color:var(--peak)}
  .cwk td:first-child{color:var(--muted)}
  .crest{font-size:12px;color:var(--dim);margin:-10px 0 20px;text-align:center}

  .cday{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .cday .dhead{margin-bottom:8px}
  .cprim{font-size:18px;font-weight:650}
  .cprim .ref{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400}
  .ccue{color:var(--amber);font-size:13px;font-style:italic;margin:2px 0 4px}
  .csec{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:12px 0 3px}
  .cline{font-size:15px;padding:4px 0;color:var(--muted)}
  .cline b{color:var(--ink);font-weight:600}
  .cline i{color:var(--amber);font-style:italic;font-size:13px}
  .cfoot{color:var(--dim);font-size:12px;text-align:center;margin:18px 0 4px;font-style:italic}
  .mhead{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .mfmt{color:var(--muted)}
  .mroll{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--amber);
    font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;
    border-radius:8px;padding:4px 10px;cursor:pointer}
  .mroll:active{background:var(--amber);color:#1a1710}
  header{padding:20px 0 8px}
  h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}

  /* week strip */
  .weeks{display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:0 0 auto;min-width:46px;text-align:center;padding:8px 0;border-radius:11px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.12s}
  .wk .n{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--muted)}
  .wk .p{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-top:2px}
  .wk.active{background:var(--amber);border-color:var(--amber)}
  .wk.active .n,.wk.active .p{color:#1a1710}
  .wk.deload.active{background:var(--deload);border-color:var(--deload)}
  .wk.peak.active{background:var(--peak);border-color:var(--peak)}

  .rx{background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin:6px 0 18px;display:flex;justify-content:space-between;align-items:center}
  .rx .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
  .rx .big{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--amber)}
  .rx .rpe{font-family:var(--mono);font-size:15px;color:var(--ink)}
  .rx .note{font-size:12px;color:var(--muted);margin-top:2px;max-width:160px;text-align:right}

  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:14px}
  .dhead{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
  .dtag{font-family:var(--mono);font-size:12px;font-weight:600;color:#1a1710;
    background:var(--amber);border-radius:6px;padding:2px 7px}
  .dtitle{font-size:16px;font-weight:600}
  .dtitle small{color:var(--muted);font-weight:400;font-size:13px}

  .lift{display:flex;gap:8px;align-items:flex-end;margin-bottom:6px}
  .fld{flex:1}
  .fld label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--dim);margin-bottom:4px}
  .fld input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;
    padding:11px 8px;text-align:center;-moz-appearance:textfield}
  .fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none}
  .fld input:focus{outline:none;border-color:var(--amber)}
  .e1{flex:0 0 78px;text-align:center;padding-bottom:2px}
  .e1 .v{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--good);
    font-variant-numeric:tabular-nums}
  .e1 .k{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
  .e1 .v.empty{color:var(--dim)}

  .subs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .chk{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font-size:14px}
  .box{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--dim);
    display:grid;place-items:center;transition:.12s}
  .chk.on .box{background:var(--good);border-color:var(--good)}
  .box svg{width:12px;height:12px;stroke:#141310;stroke-width:3;fill:none;
    opacity:0;transition:.12s}
  .chk.on .box svg{opacity:1}
  .chk .txt{color:var(--muted)}
  .chk.on .txt{color:var(--ink)}
  .chk .txt b{color:var(--ink);font-weight:600}
  .metcon .txt{font-size:13px}

  /* progress */
  .prog{margin-top:26px}
  .prog h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:0 0 4px}
  .prog .cap{font-size:12px;color:var(--dim);margin-bottom:14px}
  .plift{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px}
  .prow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .pname{font-size:15px;font-weight:600}
  .pdelta{font-family:var(--mono);font-size:15px;font-weight:600}
  .pdelta.up{color:var(--good)} .pdelta.flat{color:var(--muted)} .pdelta.none{color:var(--dim)}
  .bars{display:flex;align-items:flex-end;gap:5px;height:64px}
  .bar{flex:1;background:var(--amber-dim);border-radius:4px 4px 0 0;position:relative;
    min-height:3px;transition:.2s}
  .bar.has{background:var(--amber)}
  .bar .wl{position:absolute;bottom:-16px;left:0;right:0;text-align:center;
    font-family:var(--mono);font-size:9px;color:var(--dim)}
  .barwrap{padding-bottom:18px;width:100%}

  .foot{color:var(--dim);font-size:11px;text-align:center;margin-top:22px;line-height:1.5}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
  .pres{font-family:var(--mono);font-size:13px;color:var(--amber);margin:-6px 0 12px;
    font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .ctbl-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
    margin:16px 0 -6px;font-weight:600}
  .ctbl-lbl:first-child{margin-top:6px}
  .cextra{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--dim)}
  .cextra b{color:var(--muted);font-weight:600}
  .cextra i{color:var(--muted);font-style:italic}
  .saved-toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--good);color:#141310;font-size:12px;font-weight:700;padding:6px 14px;
    border-radius:20px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .saved-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .warn{background:#3a2a18;border:1px solid var(--peak);color:#f0d3b4;font-size:12.5px;
    line-height:1.5;border-radius:11px;padding:11px 13px;margin:12px 0}
  .tsel{display:flex;gap:6px;margin:14px 0 0}
  .tseg{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--card);
    border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:.12s}
  .tseg.on{background:var(--amber);border-color:var(--amber);color:#1a1710}
  .tnote{font-size:12px;color:var(--muted);margin:9px 2px 2px;line-height:1.5}
  .etag{color:var(--good);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    margin-right:4px}
  .cfin{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .cfin .fl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--good);
    margin-bottom:3px;font-weight:600}
  .cfin .fi{font-size:14px;color:var(--muted);padding:3px 0}
  .cfin .fi b{color:var(--ink);font-weight:600}
  .wu{margin:2px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);overflow:hidden}
  .wu summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;color:var(--amber);display:flex;align-items:center;gap:7px}
  .wu summary::-webkit-details-marker{display:none}
  .wu summary::before{content:"▸";color:var(--dim);transition:.15s;display:inline-block}
  .wu[open] summary::before{transform:rotate(90deg)}
  .wu .wi{font-size:14px;color:var(--muted);padding:4px 12px}
  .wu .wi:last-child{padding-bottom:11px}
  .wu .wi b{color:var(--ink);font-weight:600}
</style>

<div class="wrap" id="app"><div class="loading">Loading your log…</div></div>

<script>
const KEY = "sivan-strength-log-v2";
const WEEKS = [
  {n:1, phase:"est",   sr:"3 × 5", rpe:"7",     note:"Establish working weights"},
  {n:2, phase:"build", sr:"4 × 5", rpe:"7.5",   note:"+1 set"},
  {n:3, phase:"build", sr:"4 × 5", rpe:"8",      note:"+load"},
  {n:4, phase:"deload",sr:"2 × 5", rpe:"6",      note:"Deload"},
  {n:5, phase:"build", sr:"4 × 4", rpe:"8",      note:"+load, −1 rep"},
  {n:6, phase:"build", sr:"4 × 4", rpe:"8.5",    note:"+load"},
  {n:7, phase:"peak",  sr:"5 × 3", rpe:"8.5–9",  note:"Peak — heaviest"},
  {n:8, phase:"deload",sr:"2 × 4", rpe:"6",      note:"Deload + retest"},
];
const LANDMINE_WEEKS = [
  {n:1, phase:"est",   sr:"3 × 10", rpe:"7",   note:"Establish working weight"},
  {n:2, phase:"build", sr:"4 × 10", rpe:"7.5", note:"+1 set"},
  {n:3, phase:"build", sr:"4 × 10", rpe:"8",   note:"+load"},
  {n:4, phase:"deload",sr:"2 × 10", rpe:"6",   note:"Deload"},
  {n:5, phase:"build", sr:"4 × 8",  rpe:"8",   note:"+load, −2 reps"},
  {n:6, phase:"build", sr:"4 × 8",  rpe:"8.5", note:"+load"},
  {n:7, phase:"build", sr:"4 × 6",  rpe:"8.5", note:"Peak — load, not singles"},
  {n:8, phase:"deload",sr:"2 × 8",  rpe:"6",   note:"Deload + retest"},
];
function presFor(id,n){ return (id==="B"?LANDMINE_WEEKS:WEEKS)[n-1]; }
const PHASE_LABEL = {est:"Start",build:"Build",deload:"Deload",peak:"Peak"};
const METCON_POOL = {
  A:[ {fmt:"AMRAP 8",  moves:"12/10 cal bike · 10 push-ups · 12 sit-ups"},
      {fmt:"AMRAP 8",  moves:"10 cal ski · 8 ring rows · 12 hollow rocks"},
      {fmt:"4 rounds", moves:"200 m row · 8 push-ups · 12 Russian twists"},
      {fmt:"EMOM 10",  moves:"12 cal bike / 8 renegade rows / 30s plank"} ],
  B:[ {fmt:"AMRAP 8",  moves:"12 cal row · 12 KB swings (eye level) · 10 reverse lunges"},
      {fmt:"AMRAP 8",  moves:"10 cal bike · 10 goblet squats · 12 KB swings"},
      {fmt:"3 rounds", moves:"250 m row · 12 walking lunges · 10 KB deadlifts"},
      {fmt:"EMOM 10",  moves:"12 cal ski / 10 goblet squats / 10 KB swings"} ],
  C:[ {fmt:"AMRAP 8",  moves:"12 cal bike · 10 goblet squats (light) · 10 push-ups"},
      {fmt:"AMRAP 8",  moves:"10 cal ski · 12 air squats · 8 push-ups"},
      {fmt:"4 rounds", moves:"12 cal bike · 10 low step-ups (no jump) · 8 push-ups"},
      {fmt:"EMOM 10",  moves:"12 cal bike · 12 air squats · 8 incline push-ups"} ],
};
const DAYS = [
  {id:"A", tag:"A", lift:"Back Squat", sub:"Squat day",
    subs:["Romanian deadlift · 3×10","Chest-supported row · 3×12"],
    metcon:"Bike + push-ups + sit-ups · AMRAP 8"},
  {id:"B", tag:"B", lift:"Standing Landmine Press", sub:"Press day",
    subs:["Ext. rotation + face pull · 3×15","Split squat · 3×8/leg"],
    metcon:"Row + KB swings + reverse lunges · AMRAP 8"},
  {id:"C", tag:"C", lift:"Trap-bar Deadlift", sub:"Hinge day",
    subs:["Pull-up progression · 3×max","DB bench press · 3×10"],
    metcon:"Bike + goblet squats + push-ups · AMRAP 8"},
];

let state = {};      // { "w1": { A:{load,reps,rpe,subs:[b,b],metcon:b}, ... } }
let curWeek = 1;
let view = "log";
let saveTimer = null;

function blankDay(){ return {load:"",reps:"",rpe:"",subs:[false,false],metcon:false}; }
function wkey(n){ return "w"+n; }
function cell(n,d){
  const w = state[wkey(n)] || (state[wkey(n)]={});
  if(!w[d]) w[d] = blankDay();
  return w[d];
}
function e1rm(load,reps){
  const l=parseFloat(load), r=parseInt(reps);
  if(!l||!r||r<1) return null;
  return l*(1+r/30);            // Epley — normalizes across rep schemes
}

const HAS_WS = !!(window.storage && window.storage.get);
function storageAvailable(){
  if(HAS_WS) return true;
  try{ localStorage.setItem("__probe__","1"); localStorage.removeItem("__probe__"); return true; }
  catch(e){ return false; }
}
let storageOK = storageAvailable();

async function load(){
  try{
    if(HAS_WS){
      const res = await window.storage.get(KEY);
      if(res && res.value) state = JSON.parse(res.value);
    } else if(storageOK){
      const raw = localStorage.getItem(KEY);
      if(raw) state = JSON.parse(raw);
    }
  }catch(e){ state = {}; }      // no data yet — start fresh
  render();
}
function save(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      if(HAS_WS) await window.storage.set(KEY, JSON.stringify(state));
      else localStorage.setItem(KEY, JSON.stringify(state));
      flashSaved();
    }catch(e){ console.error("Save failed", e); }
  }, 250);
}
let savedEl=null;
function flashSaved(){
  if(!savedEl){
    savedEl=document.createElement("div");
    savedEl.className="saved-toast"; savedEl.textContent="Saved ✓";
    document.body.appendChild(savedEl);
  }
  savedEl.classList.add("show");
  clearTimeout(savedEl._t);
  savedEl._t=setTimeout(()=>savedEl.classList.remove("show"),900);
}

function h(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
const CHECK = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  app.appendChild(h(`<header>
    <h1>8-Week Strength Log</h1>
    <div class="sub">Strength · bone density · muscle. Log the top working set.</div>
  </header>`));

  // tabs
  const tabs = h(`<div class="tabs"></div>`);
  [["log","Log"],["card","Card"]].forEach(([v,label])=>{
    const t = h(`<div class="tab ${view===v?"active":""}">${label}</div>`);
    t.onclick = ()=>{ view=v; render(); };
    tabs.appendChild(t);
  });
  app.appendChild(tabs);

  if(!storageOK){
    app.appendChild(h(`<div class="warn">⚠️ This browser is blocking local storage, so entries won't be saved. Open the file from your device's Files app or host it (e.g. GitHub Pages) rather than from a chat/WhatsApp link.</div>`));
  }

  if(view==="card"){ renderCard(app); return; }

  // week strip
  const strip = h(`<div class="weeks"></div>`);
  WEEKS.forEach(w=>{
    const el = h(`<div class="wk ${w.phase}"><div class="n">${w.n}</div>
      <div class="p">${PHASE_LABEL[w.phase]}</div></div>`);
    if(w.n===curWeek) el.classList.add("active");
    el.onclick = ()=>{ curWeek=w.n; render(); };
    strip.appendChild(el);
  });
  app.appendChild(strip);

  const W = WEEKS[curWeek-1];
  app.appendChild(h(`<div class="rx">
    <div><div class="lbl">Week ${W.n}</div>
      <div class="big">${PHASE_LABEL[W.phase]}</div></div>
    <div style="text-align:right">
      <div class="lbl">Each lift's target →</div>
      <div class="note">${W.note}</div></div>
  </div>`));

  DAYS.forEach(day=>{
    const c = cell(curWeek, day.id);
    const card = h(`<div class="day"></div>`);
    const P = presFor(day.id, curWeek);
    const armS = day.id==="B" ? "/arm" : "";
    card.appendChild(h(`<div class="dhead">
      <span class="dtag">${day.tag}</span>
      <span class="dtitle">${day.lift} <small>· ${day.sub}</small></span></div>`));
    card.appendChild(h(`<div class="pres">${P.sr}${armS} · RPE ${P.rpe}</div>`));

    // lift inputs
    const lift = h(`<div class="lift"></div>`);
    const mkFld = (label,key,max)=>{
      const f = h(`<div class="fld"><label>${label}</label>
        <input inputmode="decimal" value="${c[key]}"></div>`);
      const inp = f.querySelector("input");
      inp.oninput = ()=>{ c[key]=inp.value; updE1(); save(); };
      return f;
    };
    lift.appendChild(mkFld("Load (kg)","load"));
    lift.appendChild(mkFld("Reps","reps"));
    lift.appendChild(mkFld("RPE","rpe"));
    const e1 = h(`<div class="e1"><div class="v empty">—</div><div class="k">est 1RM</div></div>`);
    lift.appendChild(e1);
    card.appendChild(lift);
    function updE1(){
      const v = e1rm(c.load,c.reps);
      const el = e1.querySelector(".v");
      if(v){ el.textContent = Math.round(v); el.classList.remove("empty"); }
      else { el.textContent = "—"; el.classList.add("empty"); }
    }
    updE1();

    // accessories + metcon
    const subs = h(`<div class="subs"></div>`);
    day.subs.forEach((s,i)=>{
      const parts = s.split(" · ");
      const row = h(`<div class="chk ${c.subs[i]?"on":""}">
        <div class="box">${CHECK}</div>
        <div class="txt"><b>${parts[0]}</b> · ${parts[1]||""}</div></div>`);
      row.onclick = ()=>{ c.subs[i]=!c.subs[i]; row.classList.toggle("on"); save(); };
      subs.appendChild(row);
    });
    const m = h(`<div class="chk metcon ${c.metcon?"on":""}">
      <div class="box">${CHECK}</div>
      <div class="txt">Metcon · ${day.metcon}</div></div>`);
    m.onclick = ()=>{ c.metcon=!c.metcon; m.classList.toggle("on"); save(); };
    subs.appendChild(m);
    card.appendChild(subs);

    app.appendChild(card);
  });

  // progress
  const prog = h(`<div class="prog"><h2>Progress</h2>
    <div class="cap">Estimated 1RM per week (Epley). Delta is vs. your first logged week — comparable even as reps drop from 5s to 3s.</div></div>`);
  DAYS.forEach(day=>{
    const series = WEEKS.map(w=>{
      const c = (state[wkey(w.n)]||{})[day.id];
      return c ? e1rm(c.load,c.reps) : null;
    });
    const vals = series.filter(v=>v);
    const max = vals.length?Math.max(...vals):1;
    const firstIdx = series.findIndex(v=>v);
    const lastIdx = series.length-1-[...series].reverse().findIndex(v=>v);
    let delta="", cls="none";
    if(firstIdx>=0 && lastIdx>firstIdx && series[lastIdx]){
      const d = series[lastIdx]-series[firstIdx];
      const pct = (d/series[firstIdx]*100);
      cls = d>0.5?"up":(d<-0.5?"flat":"flat");
      delta = (d>=0?"+":"")+d.toFixed(1)+" kg ("+(pct>=0?"+":"")+pct.toFixed(1)+"%)";
    } else if(vals.length===1){ cls="none"; delta="log more weeks →"; }
      else { cls="none"; delta="no data yet"; }

    const p = h(`<div class="plift">
      <div class="prow"><span class="pname">${day.lift}</span>
        <span class="pdelta ${cls}">${delta}</span></div>
      <div class="barwrap"><div class="bars"></div></div></div>`);
    const bars = p.querySelector(".bars");
    series.forEach((v,i)=>{
      const hgt = v?Math.max(4,Math.round(v/max*100)):3;
      const b = h(`<div class="bar ${v?"has":""}" style="height:${hgt}%">
        <span class="wl">${i+1}</span></div>`);
      bars.appendChild(b);
    });
    prog.appendChild(p);
  });
  app.appendChild(prog);

  app.appendChild(h(`<div class="foot">Saved automatically on this device.<br>
    Log the heaviest working set each session — that's what drives the estimate.</div>`));
}

function renderCard(app){
  if(!state.sessionLen) state.sessionLen = 45;
  const LEN = state.sessionLen;

  // session-length toggle
  const tsel = h(`<div class="tsel"></div>`);
  [45,60,75].forEach(n=>{
    const s = h(`<div class="tseg ${LEN===n?"on":""}">${n} min</div>`);
    s.onclick = ()=>{ state.sessionLen=n; save(); render(); };
    tsel.appendChild(s);
  });
  app.appendChild(tsel);
  const NOTE = {
    45:"Tight session. If short on time, cut the metcon first — never the lift.",
    60:"Un-rushed — take full 3-min rests on the primary. Extra piece included.",
    75:"Full session + mobility/core finisher. Build weeks only: add 1 primary set if strong.",
  };
  app.appendChild(h(`<div class="tnote">${NOTE[LEN]}</div>`));

  // two progression tables — main lifts vs landmine press
  const mkTable = (weeks, perArm)=>{
    const rows = weeks.map(w=>{
      const cls = w.phase==="deload"?"dl":(w.phase==="peak"?"pk":"");
      return `<tr class="${cls}"><td>${w.n}</td><td>${w.sr}</td><td>${w.rpe}</td></tr>`;
    }).join("");
    return `<table class="cwk">
      <tr><th>Wk</th><th>Sets×reps${perArm?"/arm":""}</th><th>RPE</th></tr>${rows}</table>`;
  };
  app.appendChild(h(`<div class="ctbl-lbl">Back squat · Trap-bar deadlift</div>`));
  app.appendChild(h(mkTable(WEEKS, false)));
  app.appendChild(h(`<div class="ctbl-lbl">Standing landmine press</div>`));
  app.appendChild(h(mkTable(LANDMINE_WEEKS, true)));
  app.appendChild(h(`<div class="crest">Rest between primary sets: 2–3 min</div>`));

  const cards = [
    {tag:"A", title:"Squat", prim:"Back squat", cue:"brace, full depth", ref:"main table",
     warm:["5 min easy bike / row / ski","<b>Bodyweight squats</b> × 10 — sink to depth","<b>Leg swings</b> × 10/way","<b>Ankle rock-to-wall</b> × 8/side","<b>90/90 hip switches</b> × 6/side","Then ramp sets up to the squat"],
     acc:["<b>Romanian deadlift</b> — 3 × 10","<b>Chest-supported row</b> — 3 × 12"],
     extra:"<b>Farmer carry</b> — 3–4 × 30–40 m · <i>tall, no shrug</i>",
     fin:{label:"Core finisher",items:["<b>Dead bug</b> — 3 × 10","<b>Side plank</b> — 3 × 20s/side"]}},
    {tag:"B", title:"Press", prim:"Standing landmine press", cue:"brace, ribs down → press up & slightly forward", ref:"press table",
     warm:["5 min easy bike / row / ski","<b>Band pull-aparts</b> × 15","<b>Banded external rotations</b> × 12/side","<b>Wall slides</b> × 8","A few light landmine presses","Then ramp sets up to working load"],
     acc:["<b>Ext. rotation + face pull</b> — 3 × 15","<b>Split squat</b> — 3 × 8/leg <i>no jump</i>"],
     extra:"<b>Chest-supported DB row</b> — 3 × 12 · <i>pause at top</i>",
     fin:{label:"Shoulder ER + t-spine",items:["<b>Banded ER</b> — 2 × 15/side","<b>Open book</b> — 8/side","<b>Wall slides</b> — 2 × 8"]}},
    {tag:"C", title:"Hinge", prim:"Trap-bar deadlift", cue:"brace, bar close", ref:"main table",
     warm:["5 min easy bike / row / ski","<b>Cat-cow</b> × 8","<b>Glute bridges</b> × 12 — wake the glutes","<b>Light KB deadlifts</b> × 8","1 hard breath-and-brace rehearsal","Then ramp sets up to the trap bar"],
     acc:["<b>Pull-up progression</b> — 3 × max quality","<b>DB bench press</b> — 3 × 10"],
     extra:"<b>Goblet reverse lunge</b> — 3 × 8/leg · <i>control the descent</i>",
     fin:{label:"Core finisher",items:["<b>Pallof press</b> — 3 × 10/side","<b>Dead bug</b> — 3 × 10"]}},
  ];
  if(!state.metconPick) state.metconPick = {A:0,B:0,C:0};
  cards.forEach(c=>{
    const extraHtml = LEN>=60
      ? `<div class="cextra"><span class="etag">Extra</span> ${c.extra}</div>` : "";
    const finHtml = LEN>=75
      ? `<div class="cfin"><div class="fl">${c.fin.label}</div>${
          c.fin.items.map(i=>`<div class="fi">${i}</div>`).join("")}</div>` : "";
    const el = h(`<div class="cday">
      <div class="dhead"><span class="dtag">${c.tag}</span>
        <span class="dtitle" style="font-size:15px;color:var(--muted)">${c.title}</span></div>
      <details class="wu"><summary>Warm-up</summary>${
        c.warm.map(w=>`<div class="wi">${w}</div>`).join("")}</details>
      <div class="cprim">${c.prim} <span class="ref">→ ${c.ref}</span></div>
      <div class="ccue">${c.cue}</div>
      <div class="csec">Accessories · superset</div>
      ${c.acc.map(a=>`<div class="cline">${a}</div>`).join("")}
      <div class="csec mhead">Metcon · <span class="mfmt"></span>
        <button class="mroll">🎲 new</button></div>
      <div class="cline mmoves"></div>
      ${extraHtml}
      ${finHtml}
    </div>`);
    const fmtEl = el.querySelector(".mfmt");
    const movEl = el.querySelector(".mmoves");
    const paint = ()=>{
      const pool = METCON_POOL[c.tag];
      const m = pool[state.metconPick[c.tag] % pool.length];
      fmtEl.textContent = m.fmt;
      movEl.textContent = m.moves;
    };
    paint();
    el.querySelector(".mroll").onclick = ()=>{
      state.metconPick[c.tag] = (state.metconPick[c.tag]+1) % METCON_POOL[c.tag].length;
      paint(); save();
    };
    app.appendChild(el);
  });

  app.appendChild(h(`<div class="cday">
    <div class="cprim" style="font-size:16px">Day D — Mobility <span class="ref">optional</span></div>
    <div class="cline">1. Foam roller thoracic ext. — 3–4 spots × 6</div>
    <div class="cline">2. Open book — 8/side</div>
    <div class="cline">3. Doorway pec stretch — 20s × 3 heights/side</div>
    <div class="cline">4. Banded ER @ 0° — 2 × 12/side</div>
    <div class="cline">5. Prone Y–T–W — 8 each</div>
    <div class="cline">6. Wall slides — 2 × 8</div>
    <div class="cline">7. Bottoms-up KB hold — 3 × 20s/side</div>
  </div>`));

  app.appendChild(h(`<div class="cfoot">Metcons: submaximal, don't redline.<br>
    Short on time — cut the metcon, keep the lift.</div>`));
}

load();
</script>
